# Olo for iPhone: a native SwiftUI app that shares OloKit with the Mac app.
# Generate the Xcode project with
#   brew install xcodegen && xcodegen generate
# (CI does this on every push; see .github/workflows/ios-app.yml.)
name: Olo
options:
  bundleIdPrefix: com.helius
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"
packages:
  OloKit:
    path: ../macos/OloKit
targets:
  Olo:
    type: application
    platform: iOS
    sources:
      - path: Olo/Sources
      - path: Olo/Resources
      - path: Shared
    dependencies:
      - package: OloKit
      - target: OloWidgets
    info:
      path: Olo/Info.plist
      properties:
        CFBundleDisplayName: Olo
        CFBundleName: Olo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        NSSupportsLiveActivities: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSCalendarsFullAccessUsageDescription: Olo reads your calendar on this iPhone to show your day, find free time and learn your routine. Nothing is sent anywhere unless you choose to share your day with a question.
        NSRemindersFullAccessUsageDescription: Olo shows the reminders due today and adds the ones you ask for.
        NSMicrophoneUsageDescription: "Olo uses the microphone so you can ask by voice: dictation, Quick Ask, Talk to Olo, and Hey Olo when you turn it on."
        NSSpeechRecognitionUsageDescription: Olo turns what you say into text for your question. Hey Olo listens only when you turn it on, and recognises speech on this iPhone.
        # "Keep listening on the Home Screen" (Settings, Hands free, off until turned on): Hey Olo keeps the
        # microphone while Olo is still running in the background and reads the answer aloud.
        UIBackgroundModes: [audio]
        # Press and hold the icon on the Home Screen.
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: com.helius.olo.quickask
            UIApplicationShortcutItemTitle: Quick Ask
            UIApplicationShortcutItemSubtitle: Say it, hear the answer
            UIApplicationShortcutItemIconSymbolName: mic
          - UIApplicationShortcutItemType: com.helius.olo.talk
            UIApplicationShortcutItemTitle: Talk to Olo
            UIApplicationShortcutItemSubtitle: A conversation by voice
            UIApplicationShortcutItemIconSymbolName: waveform
        CFBundleURLTypes:
          - CFBundleURLName: com.helius.olo
            CFBundleURLSchemes: [olo]
    entitlements:
      path: Olo/Olo.entitlements
      properties:
        com.apple.security.application-groups: [group.com.helius.olo]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.helius.olo
        PRODUCT_NAME: Olo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  OloWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Olo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/OloWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.helius.olo]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.helius.olo.widgets
        PRODUCT_NAME: OloWidgets
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
schemes:
  Olo:
    build:
      targets:
        Olo: all
        OloWidgets: all
