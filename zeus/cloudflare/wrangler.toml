# Zeus on Cloudflare Workers AI. Deployed by zeus/cloudflare/setup.sh (first time) and
# zeus/cloudflare/publish.sh (each promoted version). No secrets in this file: the caller key
# is a Worker secret (wrangler secret put ZEUS_TOKEN).
name = "zeus"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
# Variables set in the Cloudflare dashboard (DRAFT_MODEL, DRAFT_MAX_TOKENS) survive a deploy: only the
# ones below are written, the rest are kept.
keep_vars = true

[ai]
binding = "AI"

# Browser Run, added in the Cloudflare dashboard on 4 Nov 2026. Kept here so a wrangler deploy
# does not remove it (the dashboard asked for this file to be updated).
[browser]
binding = "Olo_browser"

[vars]
ZEUS_MODEL = "@cf/mistral/mistral-7b-instruct-v0.2-lora"
ZEUS_LORA = ""
ZEUS_VERSION = ""
ZEUS_SCORES = ""

[observability]
enabled = true
