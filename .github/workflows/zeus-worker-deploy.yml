# Deploys the zeus Worker's code (zeus/cloudflare/worker.js) after a human approves, keeping the
# adapter and scores of the version in zeus/BEST.json. For Worker fixes that need no new adapter.
# Uses the "production" environment (required reviewer), like the Edge Functions deploy.
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID. Then run "Zeus served check" to confirm.
name: Deploy Zeus Worker
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --allow-read tests/zeus_worker_test.ts
  deploy:
    name: Deploy (waits for approval)
    needs: check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::CLOUDFLARE_API_TOKEN is not set"; exit 1; fi
          bash zeus/cloud/deploy_worker.sh
