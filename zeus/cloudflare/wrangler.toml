# Zeus on Cloudflare Workers AI. Deployed by zeus/cloudflare/setup.sh (first time) and
# zeus/cloudflare/publish.sh (each promoted version). No secrets in this file: the caller key
# is a Worker secret (wrangler secret put ZEUS_TOKEN).
name = "zeus"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[ai]
binding = "AI"

[vars]
ZEUS_MODEL = "@cf/mistral/mistral-7b-instruct-v0.2-lora"
DRAFT_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
ZEUS_LORA = ""
ZEUS_VERSION = ""
ZEUS_SCORES = ""

[observability]
enabled = true
