name: POL Net browser

on:
  push:
    branches: [main]
    paths: ["apps/polnet/**", ".github/workflows/polnet.yml"]
  pull_request:
    paths: ["apps/polnet/**", ".github/workflows/polnet.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: polnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (Deno, memory and Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/polnet/server
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Migration, twice
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "create role anon; create role authenticated;"
          for i in 1 2; do
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/001_polnet.sql -f supabase/migrations/002_polnet_helpers.sql
          done
      - run: deno lint
      - run: deno check supabase/functions/polnet-api/index.ts scripts/*.ts
      - run: deno test -A tests/
        env:
          POLNET_TEST_PG: postgres://postgres:postgres@localhost:5432/postgres

  browser:
    name: Browser (unit and end to end)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/polnet/browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci || npm install --no-audit --no-fund
      - run: npm test
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: xvfb-run -a npm run e2e

  mac:
    name: Mac app (unsigned dmg)
    needs: [server, browser]
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/polnet/browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install --no-audit --no-fund
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: POL-Net-mac
          path: apps/polnet/browser/dist/*.dmg
          retention-days: 30
